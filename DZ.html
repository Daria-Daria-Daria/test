<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的日常作息 · утренняя рутина</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #2e2e2e;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            background: #fdfbf7;
            border-radius: 48px;
            padding: 30px 30px 40px;
            box-shadow: 0 30px 50px -20px rgba(0,0,0,0.6);
            max-width: 1000px;
            width: 100%;
        }

        h1 {
            text-align: center;
            font-weight: 350;
            letter-spacing: 3px;
            color: #d4af37;
            margin-bottom: 20px;
            font-size: 2.2rem;
            text-transform: uppercase;
        }

        .canvas-wrapper {
            background: #efe7db;
            border-radius: 36px;
            padding: 15px;
            border: 2px solid #d4af37;
            box-shadow: inset 0 0 0 2px #fffcf5;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #fcf8f2;
            border-radius: 24px;
            cursor: pointer;
        }

        .info-area {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .message-box {
            flex: 1;
            background: #fff9f0;
            border-left: 12px solid #d4af37;
            border-radius: 40px;
            padding: 18px 28px;
            font-size: 1.25rem;
            color: #2e2e2e;
            font-weight: 350;
            box-shadow: 0 8px 20px -8px #bba27a;
            min-height: 90px;
            display: flex;
            align-items: center;
            line-height: 1.5;
        }

        .controls {
            display: flex;
            gap: 15px;
            background: #ede3d6;
            padding: 12px 28px;
            border-radius: 60px;
        }

        .key {
            background: #fefaf5;
            border-radius: 20px;
            padding: 8px 28px;
            font-weight: 500;
            color: #4a3f35;
            border: 1px solid #d4af37;
            box-shadow: 0 5px 0 #b48b4a;
            font-size: 1.3rem;
        }

        .reset-btn {
            background: #d4af37;
            border: none;
            border-radius: 50px;
            padding: 12px 36px;
            font-size: 1.3rem;
            color: #2e2e2e;
            font-weight: 500;
            border-bottom: 6px solid #9e7f32;
            cursor: pointer;
            transition: 0.05s linear;
            letter-spacing: 1px;
        }

        .reset-btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .footer {
            text-align: center;
            color: #b9a27b;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>☀️ 我的日常作息 ☀️</h1>
    <div class="canvas-wrapper">
        <canvas id="gameCanvas" width="900" height="300"></canvas>
    </div>

    <div class="info-area">
        <div class="message-box" id="messageDisplay">
            ✨ зажми → чтобы идти вперед
        </div>
        <div class="controls">
            <span class="key">←</span>
            <span class="key">→</span>
        </div>
        <button class="reset-btn" id="resetButton">⟲ заново</button>
    </div>
    <div class="footer">
        ← назад — иконки появятся и снова дадут текст
    </div>
</div>

<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const messageDisplay = document.getElementById('messageDisplay');

    const CANVAS_WIDTH = 900;
    const CANVAS_HEIGHT = 300;
    const GROUND_Y = 230;

    // ----- ПЕРСОНАЖ -----
    const player = {
        x: 150,
        y: GROUND_Y - 42,
        width: 30,
        height: 42,
        color: '#6b5843'
    };

    // ----- МИР -----
    let worldOffset = 0;
    const MOVE_SPEED = 4;
    let items = [];

    // Тексты (обновлены)
    const itemTexts = {
        bed: '我早上8点起床 (Wǒ zǎoshang 8 diǎn qǐchuáng)',
        mop: '我正在打扫房间 (Wǒ zhèngzài dǎsǎo fángjiān)',
        comb: '我正在梳头 (Wǒ zhèngzài shūtóu)',
        clothes: '我正在换衣服 (Wǒ zhèngzài huàn yīfú)',
        toothbrush: '我用牙刷和牙膏刷牙 (Wǒ yòng yáshuā hé yágāo shuāyá)',
        shower: '我在洗澡 (Wǒ zài xǐzǎo)',
        breakfast: '我正在吃早餐 (Wǒ zhèngzài chī zǎocān)',
        cream: '面霜 (Miànshuāng)',
        lipstick: '口红 (Kǒuhóng)',
        mascara: '睫毛膏 (Jiémáo gāo)',
        powder: '香粉 (Xiāng fěn)',
        computerAM: '我早上10点开始工作 (Wǒ zǎoshang 10 diǎn kāishǐ gōngzuò)',
        sport: '我正在做运动 (Wǒ zhèngzài zuò yùndòng)',
        lunch: '我下午2点吃午饭 (Wǒ xiàwǔ 2 diǎn chī wǔfàn)',
        computerPM: '我午饭后工作 (Wǒ wǔfàn hòu gōngzuò)',
        catFood: '我喂猫 (Wǒ wèi māo)',
        danceCat: '我和猫玩耍 (Wǒ hé māo wánshuǎ)',
        park: '下班后我去公园散步 (Xiàbān hòu wǒ qù gōngyuán sànbù)',
        clouds: '我喜欢阴天 (Wǒ xǐhuān yīn tiān)',
        bookTV: '散步后，我玩电脑 (Sànbù hòu, wǒ wán diànnǎo)',
        book: '我也喜欢晚上看书 (Wǒ yě xǐhuān wǎnshàng kànshū)',
        pajamas: '我又要换衣服了 (Wǒ yòu yào huàn yīfúle)',
        dinner: '我晚上八点吃晚饭 (Wǒ wǎnshàng bā diǎn chī wǎnfàn)',
        eveningShower: '晚上我会洗澡刷牙 (Wǎnshàng wǒ huì xǐzǎo shuāyá)',
        tooth: '我用牙膏刷牙 (Wǒ yòng yágāo shuāyá)',        // новая иконка зуба
        makeup1: '我用卸妆水卸妆 (Wǒ yòng xièzhuāng shuǐ xièzhuāng)',
        makeup2: '我用精华液和面霜 (Wǒ yòng jīnghuá yè hé miànshuāng)',
        alarmClock: '我设置闹钟 (Wǒ shèzhì nàozhōng)',
        bedFinal: '我睡觉了 (Wǒ shuìjiào le) 晚安'
    };

    // Эмодзи
    const itemEmojis = {
        bed: '🛏️',
        mop: '🧹',
        comb: '🪮',
        clothes: '👚',
        toothbrush: '🪥',
        shower: '🚿',
        breakfast: '🍳',
        cream: '🧴',
        lipstick: '💄',
        mascara: '👁️',
        powder: '🧽',
        computerAM: '💻',
        sport: '🏃',
        lunch: '🍲',
        computerPM: '🖥️',
        catFood: '🥫',
        danceCat: '🐱💃',
        park: '🌳',
        clouds: '☁️',
        bookTV: '📺',
        book: '📘',
        pajamas: '🛏️',
        dinner: '🍽️',
        eveningShower: '🚿',
        tooth: '🦷',              // иконка зуба
        makeup1: '🧴',
        makeup2: '✨',
        alarmClock: '⏰',
        bedFinal: '🛌'
    };

    // Полная последовательность (пустая иконка заменена на зуб)
    const itemSequence = [
        { name: 'bed', width: 40 },
        { name: 'mop', width: 30 },
        { name: 'comb', width: 25 },
        { name: 'clothes', width: 35 },
        { name: 'toothbrush', width: 30 },
        { name: 'shower', width: 35 },
        { name: 'breakfast', width: 35 },
        { name: 'cream', width: 30 },
        { name: 'lipstick', width: 25 },
        { name: 'mascara', width: 22 },
        { name: 'powder', width: 28 },
        { name: 'computerAM', width: 40 },
        { name: 'sport', width: 35 },
        { name: 'lunch', width: 35 },
        { name: 'computerPM', width: 40 },
        { name: 'catFood', width: 30 },
        { name: 'danceCat', width: 45 },
        { name: 'park', width: 40 },
        { name: 'clouds', width: 35 },
        { name: 'bookTV', width: 40 },
        { name: 'book', width: 30 },
        { name: 'pajamas', width: 35 },
        { name: 'dinner', width: 35 },
        { name: 'eveningShower', width: 35 },
        { name: 'tooth', width: 25 },           // зуб вместо пустой иконки
        { name: 'makeup1', width: 32 },
        { name: 'makeup2', width: 32 },
        { name: 'alarmClock', width: 30 },
        { name: 'bedFinal', width: 40 }
    ];

    const ITEM_SPACING = 270;

    // Построить мир
    function buildWorld() {
        items = [];
        let currentX = 600;

        for (let seq of itemSequence) {
            items.push({
                name: seq.name,
                x: currentX,
                y: GROUND_Y - 40,
                width: seq.width,
                height: 35,
                emoji: itemEmojis[seq.name] || '📦',
                text: itemTexts[seq.name] || '...',
                collected: false,
                animating: false,
                animationStart: 0,
                respawning: false,
                respawnStart: 0
            });
            currentX += ITEM_SPACING;
        }
    }

    // Сброс
    function resetGame() {
        worldOffset = 0;
        buildWorld();
        messageDisplay.innerText = '✨ зажми → чтобы идти вперед';
    }

    // ----- ПРОВЕРКА СБОРА -----
    function checkCollection() {
        for (let item of items) {
            if (item.collected) continue;

            let screenX = item.x - worldOffset;

            if (screenX < player.x + player.width && screenX + item.width > player.x) {
                item.collected = true;
                item.animating = true;
                item.animationStart = Date.now();
                messageDisplay.innerText = item.text;
            }
        }
    }

    // ----- ВОССТАНОВЛЕНИЕ ИКОНОК ПРИ ДВИЖЕНИИ НАЗАД -----
    function checkRespawn() {
        for (let item of items) {
            if (!item.collected) continue;

            let screenX = item.x - worldOffset;

            if (screenX > player.x + player.width) {
                item.collected = false;
                item.animating = false;
                item.respawning = true;
                item.respawnStart = Date.now();
            }
        }
    }

    // ----- УПРАВЛЕНИЕ -----
    let rightPressed = false;
    let leftPressed = false;

    window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') {
            e.preventDefault();
            rightPressed = true;
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            leftPressed = true;
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.key === 'ArrowRight') {
            rightPressed = false;
        } else if (e.key === 'ArrowLeft') {
            leftPressed = false;
        }
    });

    // Обновление мира
    function updateWorld() {
        let moved = false;

        if (rightPressed) {
            worldOffset += MOVE_SPEED;
            moved = true;
        }
        if (leftPressed) {
            worldOffset = Math.max(0, worldOffset - MOVE_SPEED);
            moved = true;
            checkRespawn();
        }

        if (moved) {
            checkCollection();
        }
    }

    // ----- ОТРИСОВКА -----
    function draw() {
        ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

        // Небо
        ctx.fillStyle = '#fdf4e4';
        ctx.fillRect(0, 0, CANVAS_WIDTH, GROUND_Y);

        // Земля
        ctx.fillStyle = '#e5d5bd';
        ctx.fillRect(0, GROUND_Y, CANVAS_WIDTH, CANVAS_HEIGHT - GROUND_Y);
        ctx.fillStyle = '#c8b59b';
        for (let i = 0; i < 20; i++) {
            let x = (i * 70 + (worldOffset * 0.3) % 70) - 70;
            ctx.fillRect(x, GROUND_Y + 5, 30, 4);
        }

        // Рисуем иконки
        ctx.font = '36px "Segoe UI", "Inter", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for (let item of items) {
            let screenX = item.x - worldOffset;
            if (screenX + item.width < 0 || screenX > CANVAS_WIDTH) continue;

            // Анимация появления
            if (item.respawning) {
                let elapsed = (Date.now() - item.respawnStart) / 300;
                if (elapsed < 1.0) {
                    ctx.save();
                    ctx.globalAlpha = elapsed;
                    ctx.translate(screenX + item.width/2, item.y + item.height/2);
                    ctx.scale(elapsed, elapsed);
                    ctx.fillStyle = '#2e2e2e';
                    ctx.fillText(item.emoji, 0, 0);
                    ctx.restore();
                } else {
                    item.respawning = false;
                }
                continue;
            }

            // Анимация исчезновения
            if (item.collected && item.animating) {
                let elapsed = (Date.now() - item.animationStart) / 300;
                if (elapsed < 1.0) {
                    ctx.save();
                    ctx.globalAlpha = 1 - elapsed;
                    ctx.translate(screenX + item.width/2, item.y + item.height/2);
                    ctx.scale(1 - elapsed * 0.8, 1 - elapsed * 0.8);
                    ctx.fillStyle = '#2e2e2e';
                    ctx.fillText(item.emoji, 0, 0);
                    ctx.restore();
                } else {
                    item.animating = false;
                }
                continue;
            }

            if (item.collected) continue;

            // Обычная иконка
            ctx.shadowColor = '#bba88b';
            ctx.shadowBlur = 8;
            ctx.fillStyle = '#4a3f35';
            ctx.globalAlpha = 0.2;
            ctx.fillText(item.emoji, screenX + item.width/2 + 4, item.y + item.height/2 + 4);
            ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
            ctx.shadowColor = 'transparent';

            ctx.fillStyle = '#2e2e2e';
            ctx.fillText(item.emoji, screenX + item.width/2, item.y + item.height/2);
        }

        // Персонаж
        ctx.shadowColor = '#a28460';
        ctx.shadowBlur = 10;
        ctx.fillStyle = player.color;
        ctx.beginPath();
        roundRect(ctx, player.x, player.y, player.width, player.height, 12);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#f5e8d8';
        ctx.beginPath();
        ctx.arc(player.x + 22, player.y + 12, 5, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = '#2e2e2e';
        ctx.beginPath();
        ctx.arc(player.x + 24, player.y + 11, 2, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = '#5f4d3c';
        let stepOffset = (rightPressed || leftPressed) ? Math.sin(Date.now() * 0.02) * 4 : 0;
        ctx.fillRect(player.x + 4, player.y + player.height-6, 7, 10);
        ctx.fillRect(player.x + 18, player.y + player.height-6 + stepOffset, 7, 10);
    }

    function roundRect(ctx, x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        return ctx;
    }

    // ----- ЗАПУСК -----
    function gameLoop() {
        updateWorld();
        draw();
        requestAnimationFrame(gameLoop);
    }

    document.getElementById('resetButton').addEventListener('click', () => {
        resetGame();
    });

    resetGame();
    gameLoop();
})();
</script>
</body>
</html>
